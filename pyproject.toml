[project]
name = "microvla"
version = "0.1.0"
description = "A small pi0.5-style VLA and pretrained pi0.5 inference on a laptop GPU"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    # Model, training, data preparation and inference imports.
    "accelerate==1.15.0",
    "av==15.1.0",
    "bitsandbytes==0.50.2",
    "huggingface-hub==2.4.0",
    "lerobot[pi,libero,evaluation]==0.7.0",
    "matplotlib==3.11.2",
    "numpy==2.2.6",
    "pillow==13.0.0",
    "pyarrow==26.0.1",
    "safetensors==0.8.0",
    "tensorboard==2.21.0",
    "torch==2.15.0",
    "transformers==5.22.2",
    "wandb==0.31.0",
    # Runtime dependencies of LeRobot's policy, rollout and LIBERO environment.
    "datasets==5.2.0",
    "einops==0.8.2",
    "hf-libero==0.1.4",
    "mujoco==3.8.1",
    "pandas==2.3.3",
    "robosuite==1.4.0",
    "scipy==1.18.1",
    "sentencepiece==0.2.3",
    "torchcodec==0.17.0",
    "torchvision==0.29.2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false
